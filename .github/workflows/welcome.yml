name: Waitlist welcome email

# Checks the Supabase waitlist every 10 minutes and emails new signups
# through Gmail. Scheduled runs only send when SEND_ENABLED is "true".
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "run = check the list (sends only if SEND_ENABLED), test = one email to the sending Gmail"
        type: choice
        options: [test, run]
        default: test

concurrency:
  group: waitlist-welcome
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  welcome:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Send welcome emails
        env:
          SUPABASE_URL: https://odhzmfboqsooumilciwu.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          SEND_ENABLED: "false"
          MODE: ${{ inputs.mode || 'run' }}
        run: python3 .github/welcome/send_welcome.py
